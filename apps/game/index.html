<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big River</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10141b; overflow: hidden; font-family: system-ui, sans-serif; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; touch-action: none; }
      #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(4, 6, 10, 0.75) 100%); }
      .hud { position: fixed; color: #e9e4d8; pointer-events: none; text-shadow: 0 1px 2px #000; }
      #where { top: 14px; left: 16px; }
      #where b { display: block; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; color: #f0b44a; }
      #where span { font-size: 13px; opacity: 0.85; }
      #help { bottom: 12px; left: 16px; font-size: 12px; opacity: 0.7; }
      #credit { bottom: 12px; right: 16px; font-size: 11px; opacity: 0.55; }
      .poi { position: fixed; transform: translate(-50%, -100%); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #f3d9a4; text-shadow: 0 0 6px #000, 0 1px 2px #000; white-space: nowrap; pointer-events: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #f0b44a; letter-spacing: 0.2em; font-size: 14px; background: #10141b; transition: opacity 0.6s; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="vignette"></div>
    <div id="labels"></div>
    <div id="where" class="hud"><b>Taquara</b><span></span></div>
    <div id="help" class="hud">WASD ou setas: andar · Shift: correr · Q/E: girar câmera · roda: zoom · clique e segure: andar até o ponteiro</div>
    <div id="credit" class="hud"></div>
    <div id="loading">CARREGANDO A CERRAÇÃO…</div>
    <script type="module" src="/src3d/main.ts"></script>
  </body>
</html>
